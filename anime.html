<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Naim Hub - All-in-One Streaming Platform</title>

  <!-- Google Fonts & FontAwesome Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- HLS.js Library for .m3u8 Video Playback -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    /* ==========================================================================
       1. GLOBAL STYLES & VARIABLES
       ========================================================================== */
    :root {
      --bg-dark: #090b10;
      --bg-card: #131722;
      --bg-modal: #181d2b;
      --primary: #00dc82;
      --primary-hover: #00b368;
      --accent-gold: #f59e0b;
      --text-main: #ffffff;
      --text-muted: #94a3b8;
      --border: #232a3b;
      --radius: 12px;
      --transition: all 0.25s ease-in-out;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); padding-bottom: 75px; min-height: 100vh; }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-dark); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

    /* ==========================================================================
       2. HEADER & SEARCH BAR
       ========================================================================== */
    .header { position: sticky; top: 0; z-index: 100; background: rgba(9, 11, 16, 0.9); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: 14px 20px; }
    .header-container { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; gap: 15px; }

    .logo { font-size: 22px; font-weight: 700; color: var(--primary); display: flex; align-items: center; gap: 8px; cursor: pointer; }
    
    .search-box { flex: 1; max-width: 450px; position: relative; }
    .search-box input { width: 100%; padding: 10px 15px 10px 40px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px; color: #fff; font-size: 13px; outline: none; transition: var(--transition); }
    .search-box input:focus { border-color: var(--primary); box-shadow: 0 0 10px rgba(0, 220, 130, 0.2); }
    .search-box i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 14px; }

    .badge-btn { background: var(--bg-card); border: 1px solid var(--border); color: #fff; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative; transition: var(--transition); }
    .badge-btn:hover { border-color: var(--primary); color: var(--primary); }
    .badge-count { position: absolute; top: -3px; right: -3px; background: var(--primary); color: #000; font-size: 10px; font-weight: 700; width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }

    /* ==========================================================================
       3. MAIN CONTENT, TABS & CARDS
       ========================================================================== */
    .container { max-width: 1200px; margin: 0 auto; padding: 20px 15px; }

    .categories-bar { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 12px; margin-bottom: 20px; scrollbar-width: none; }
    .cat-btn { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-muted); padding: 8px 18px; border-radius: 20px; font-size: 13px; cursor: pointer; white-space: nowrap; transition: var(--transition); }
    .cat-btn.active, .cat-btn:hover { background: var(--primary); color: #000; font-weight: 600; border-color: var(--primary); }

    .section-title { font-size: 18px; font-weight: 600; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 16px; }
    
    .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; cursor: pointer; transition: var(--transition); position: relative; }
    .card:hover { transform: translateY(-5px); border-color: var(--primary); box-shadow: 0 8px 20px rgba(0, 220, 130, 0.15); }
    
    .card-img-wrapper { width: 100%; height: 200px; position: relative; background: #1a1e2b; }
    .card-img-wrapper img { width: 100%; height: 100%; object-fit: cover; }
    .tag { position: absolute; top: 8px; right: 8px; background: rgba(0, 0, 0, 0.8); color: var(--primary); font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; border: 1px solid var(--primary); }

    .card-body { padding: 10px; }
    .card-title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Skeleton Loading UI */
    .skeleton { background: linear-gradient(90deg, #131722 25%, #232a3b 50%, #131722 75%); background-size: 200% 100%; animation: skeleton-loading 1.5s infinite; border-radius: var(--radius); height: 250px; }
    @keyframes skeleton-loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    /* ==========================================================================
       4. VIDEO PLAYER MODAL OVERLAY
       ========================================================================== */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.9); z-index: 200; overflow-y: auto; padding: 20px 10px; backdrop-filter: blur(8px); }
    .modal-content { max-width: 850px; margin: 20px auto; background: var(--bg-modal); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; position: relative; }
    
    .close-modal { position: absolute; top: 12px; right: 12px; background: rgba(0,0,0,0.6); color: #fff; width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 1px solid var(--border); z-index: 10; }
    .close-modal:hover { background: #ef4444; }

    .player-box { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; }
    .player-box video { width: 100%; height: 100%; object-fit: contain; }

    .modal-details { padding: 20px; }
    .modal-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 15px; margin-bottom: 15px; }
    .modal-title { font-size: 18px; font-weight: 700; }

    .save-btn { background: var(--bg-card); border: 1px solid var(--border); color: #fff; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-size: 12px; display: flex; align-items: center; gap: 6px; transition: var(--transition); }
    .save-btn.active { background: var(--accent-gold); color: #000; border-color: var(--accent-gold); font-weight: 600; }

    .episodes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 8px; max-height: 180px; overflow-y: auto; margin-top: 10px; }
    .ep-btn { background: var(--bg-card); border: 1px solid var(--border); color: #fff; padding: 8px 4px; border-radius: 6px; font-size: 11px; font-weight: 600; cursor: pointer; text-align: center; transition: var(--transition); }
    .ep-btn:hover, .ep-btn.active { background: var(--primary); color: #000; border-color: var(--primary); }

    /* ==========================================================================
       5. BOTTOM NAV & TOAST NOTIFICATIONS
       ========================================================================== */
    .toast { position: fixed; top: 20px; right: 20px; z-index: 300; background: var(--bg-card); border-left: 4px solid var(--primary); color: #fff; padding: 12px 20px; border-radius: 6px; font-size: 13px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }

    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background: rgba(19, 23, 34, 0.95); backdrop-filter: blur(10px); border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; z-index: 100; }
    .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-muted); font-size: 11px; gap: 3px; cursor: pointer; }
    .nav-item.active { color: var(--primary); font-weight: 600; }
    .nav-item i { font-size: 18px; }
  </style>
</head>
<body>

  <!-- Top Header Navigation -->
  <header class="header">
    <div class="header-container">
      <div class="logo" onclick="app.loadHome()">
        <i class="fa-solid fa-play-circle"></i> Naim Hub
      </div>
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" placeholder="Search movies, anime, series...">
      </div>
      <div class="badge-btn" onclick="app.showWatchlist()" title="Saved Watchlist">
        <i class="fa-solid fa-bookmark"></i>
        <span class="badge-count" id="watchlistCount">0</span>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="container">
    
    <!-- Dynamic Category Filter Tabs -->
    <div class="categories-bar">
      <button class="cat-btn active" data-tab="home" onclick="app.loadHome()">🔥 Home</button>
      <button class="cat-btn" data-tab="naruto" onclick="app.filterCategory('naruto')">🎬 Naruto</button>
      <button class="cat-btn" data-tab="onepiece" onclick="app.filterCategory('one piece')">🏴‍☠️ One Piece</button>
      <button class="cat-btn" data-tab="demon" onclick="app.filterCategory('demon slayer')">⚔️ Demon Slayer</button>
      <button class="cat-btn" data-tab="watchlist" onclick="app.showWatchlist()">📌 My Watchlist</button>
    </div>

    <!-- Content Title & Grid -->
    <div class="section-title" id="sectionTitle">🔥 Trending Streams</div>
    <div class="grid" id="mainGrid"></div>

  </main>

  <!-- Player Modal -->
  <div class="modal" id="playerModal">
    <div class="modal-content">
      <div class="close-modal" onclick="app.closeModal()"><i class="fa-solid fa-xmark"></i></div>
      
      <!-- HTML5 Video Player with Controls -->
      <div class="player-box">
        <video id="videoPlayer" controls autoplay crossorigin="anonymous"></video>
      </div>

      <div class="modal-details">
        <div class="modal-header">
          <div>
            <div class="modal-title" id="modalTitle">Loading Title...</div>
            <div id="modalEpText" style="font-size:12px; color:var(--text-muted); margin-top:4px;">Select an episode</div>
          </div>
          <button class="save-btn" id="bookmarkBtn" onclick="app.toggleBookmark()">
            <i class="fa-regular fa-bookmark"></i> Bookmark
          </button>
        </div>

        <div style="font-size:13px; font-weight:600; margin-bottom:8px; color:var(--text-muted);">Episodes:</div>
        <div class="episodes-grid" id="episodesGrid"></div>
      </div>
    </div>
  </div>

  <!-- Mobile Bottom Navigation -->
  <nav class="bottom-nav">
    <div class="nav-item active" onclick="app.loadHome()"><i class="fa-solid fa-house"></i>Home</div>
    <div class="nav-item" onclick="app.filterCategory('movie')"><i class="fa-solid fa-film"></i>Movies</div>
    <div class="nav-item" onclick="app.filterCategory('action')"><i class="fa-solid fa-tv"></i>Series</div>
    <div class="nav-item" onclick="app.showWatchlist()"><i class="fa-solid fa-bookmark"></i>Watchlist</div>
  </nav>

  <!-- Container for Toast Notifications -->
  <div id="toastContainer"></div>

  <!-- ==========================================================================
       6. COMPLETE APPLICATION JAVASCRIPT LOGIC WITH HLS PLAYER
       ========================================================================== -->
  <script>
    class SingleFileApp {
      constructor() {
        this.apiBase = "https://api-consumet-org-ynxk.vercel.app/anime/gogoanime";
        this.watchlist = JSON.parse(localStorage.getItem('naimhub_saved')) || [];
        this.currentAnime = null;
        this.searchTimer = null;
        this.hlsInstance = null; // HLS instance controller

        this.init();
      }

      init() {
        this.updateBadge();
        this.setupSearch();
        this.loadHome();
      }

      // UI Helpers
      showSkeletons(count = 12) {
        const grid = document.getElementById('mainGrid');
        grid.innerHTML = Array(count).fill('<div class="skeleton"></div>').join('');
      }

      showToast(message) {
        const container = document.getElementById('toastContainer');
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.innerText = message;
        container.appendChild(toast);
        setTimeout(() => toast.remove(), 2500);
      }

      updateBadge() {
        document.getElementById('watchlistCount').innerText = this.watchlist.length;
      }

      // Data Fetching
      async fetchData(endpoint) {
        try {
          const res = await fetch(`${this.apiBase}${endpoint}`);
          if (!res.ok) throw new Error("API Network failure");
          return await res.json();
        } catch (err) {
          console.error(err);
          this.showToast("ডাটা লোড করতে সমস্যা হয়েছে!");
          return null;
        }
      }

      // Application Actions
      async loadHome() {
        this.setActiveTab('home');
        document.getElementById('sectionTitle').innerText = "🔥 Trending Streams";
        this.showSkeletons();

        const data = await this.fetchData('/top-airing');
        this.renderGrid(data?.results || []);
      }

      async filterCategory(query) {
        this.setActiveTab(query);
        document.getElementById('sectionTitle').innerText = `🎬 Category: ${query.toUpperCase()}`;
        this.showSkeletons();

        const data = await this.fetchData(`/${query}`);
        this.renderGrid(data?.results || []);
      }

      setupSearch() {
        const input = document.getElementById('searchInput');
        input.addEventListener('input', (e) => {
          clearTimeout(this.searchTimer);
          const val = e.target.value.trim();

          if (val.length > 2) {
            this.searchTimer = setTimeout(async () => {
              document.getElementById('sectionTitle').innerText = `🔍 Search: "${val}"`;
              this.showSkeletons();
              const data = await this.fetchData(`/${val}`);
              this.renderGrid(data?.results || []);
            }, 400);
          } else if (val.length === 0) {
            this.loadHome();
          }
        });
      }

      renderGrid(items) {
        const grid = document.getElementById('mainGrid');
        if (!items || items.length === 0) {
          grid.innerHTML = '<p style="color:var(--text-muted); grid-column: 1/-1;">কোনো ফলাফল পাওয়া যায়নি!</p>';
          return;
        }

        grid.innerHTML = items.map(item => `
          <div class="card" onclick="app.openModal('${item.id}', '${item.title.replace(/'/g, "")}')">
            <div class="card-img-wrapper">
              <span class="tag">HD</span>
              <img src="${item.image}" alt="${item.title}" loading="lazy" onerror="this.src='https://via.placeholder.com/140x200?text=No+Cover'">
            </div>
            <div class="card-body">
              <div class="card-title">${item.title}</div>
            </div>
          </div>
        `).join('');
      }

      // Modal & Player Controller
      async openModal(id, title) {
        this.currentAnime = { id, title };
        document.getElementById('playerModal').style.display = 'block';
        document.getElementById('modalTitle').innerText = title;
        
        const epGrid = document.getElementById('episodesGrid');
        epGrid.innerHTML = 'Loading episodes...';

        this.updateBookmarkBtn();

        const data = await this.fetchData(`/info?id=${id}`);
        
        if (data && data.episodes && data.episodes.length > 0) {
          epGrid.innerHTML = data.episodes.map(ep => `
            <button class="ep-btn" id="ep-${ep.number}" onclick="app.playStream('${ep.id}', ${ep.number})">
              Ep ${ep.number}
            </button>
          `).join('');

          // Auto-play Episode 1
          this.playStream(data.episodes[0].id, 1);
        } else {
          epGrid.innerHTML = 'No episodes available.';
        }
      }

      async playStream(episodeId, epNum) {
        document.querySelectorAll('.ep-btn').forEach(btn => btn.classList.remove('active'));
        const activeBtn = document.getElementById(`ep-${epNum}`);
        if (activeBtn) activeBtn.classList.add('active');

        document.getElementById('modalEpText').innerText = `Playing Episode ${epNum}`;

        const video = document.getElementById('videoPlayer');

        // Destroy previous HLS player instance if exists
        if (this.hlsInstance) {
          this.hlsInstance.destroy();
          this.hlsInstance = null;
        }

        video.pause();
        video.removeAttribute('src');
        video.load();

        const data = await this.fetchData(`/watch?episodeId=${episodeId}`);
        
        if (data && data.sources && data.sources.length > 0) {
          // Select m3u8 stream source
          const streamUrl = data.sources.find(s => s.isM3U8 || s.url.includes('.m3u8'))?.url || data.sources[0].url;

          // HLS.js streaming mechanism
          if (Hls.isSupported()) {
            this.hlsInstance = new Hls({
              enableWorker: true,
              lowLatencyMode: true
            });
            this.hlsInstance.loadSource(streamUrl);
            this.hlsInstance.attachMedia(video);
            this.hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
              video.play().catch(() => console.log('Autoplay deferred'));
            });
          } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            // Native Safari HLS support
            video.src = streamUrl;
            video.addEventListener('loadedmetadata', () => {
              video.play().catch(() => console.log('Autoplay deferred'));
            });
          } else {
            this.showToast("আপনার ব্রাউজারে HLS ভিডিও সাপোর্ট করছে না!");
          }
        } else {
          this.showToast("ভিডিও স্ট্রিমিং লিঙ্ক পাওয়া যায়নি!");
        }
      }

      closeModal() {
        document.getElementById('playerModal').style.display = 'none';
        const video = document.getElementById('videoPlayer');
        
        if (this.hlsInstance) {
          this.hlsInstance.destroy();
          this.hlsInstance = null;
        }

        video.pause();
        video.removeAttribute('src');
        video.load();
      }

      // Watchlist System
      toggleBookmark() {
        if (!this.currentAnime) return;

        const index = this.watchlist.findIndex(item => item.id === this.currentAnime.id);
        if (index > -1) {
          this.watchlist.splice(index, 1);
          this.showToast("Removed from Watchlist");
        } else {
          this.watchlist.push(this.currentAnime);
          this.showToast("Saved to Watchlist!");
        }

        localStorage.setItem('naimhub_saved', JSON.stringify(this.watchlist));
        this.updateBadge();
        this.updateBookmarkBtn();
      }

      updateBookmarkBtn() {
        const btn = document.getElementById('bookmarkBtn');
        const isSaved = this.watchlist.some(item => item.id === this.currentAnime?.id);
        if (isSaved) {
          btn.classList.add('active');
          btn.innerHTML = `<i class="fa-solid fa-bookmark"></i> Saved`;
        } else {
          btn.classList.remove('active');
          btn.innerHTML = `<i class="fa-regular fa-bookmark"></i> Bookmark`;
        }
      }

      showWatchlist() {
        this.setActiveTab('watchlist');
        document.getElementById('sectionTitle').innerText = "📌 My Watchlist";
        this.renderGrid(this.watchlist);
      }

      setActiveTab(tabName) {
        document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
        const activeBtn = document.querySelector(`[data-tab="${tabName}"]`);
        if (activeBtn) activeBtn.classList.add('active');
      }
    }

    // Initialize Web App
    const app = new SingleFileApp();
  </script>
</body>
</html>
